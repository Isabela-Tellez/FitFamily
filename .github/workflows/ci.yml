name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile sources
        run: python -m compileall -q src tests data/raw

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke test: arranque de Streamlit
        run: |
          python -m streamlit run src/ui/app.py --server.port 8503 --server.headless true --server.address 127.0.0.1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8503/_stcore/health >/dev/null; then
              echo "Streamlit arranco correctamente (health 200)."
              exit 0
            fi
            sleep 2
          done
          echo "Streamlit no arranco a tiempo."
          exit 1
