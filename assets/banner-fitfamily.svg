<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" aria-label="FitFamily banner — investigación de mercado y bienestar familiar">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#172B2A"/>
      <stop offset="100%" stop-color="#2a4a42"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="220" fill="url(#bgGrad)"/>
  <!-- Decorative curved shapes -->
  <circle cx="680" cy="40" r="120" fill="#A9DCC5" opacity="0.12"/>
  <circle cx="120" cy="180" r="90" fill="#D7A96B" opacity="0.15"/>
  <!-- Main text -->
  <text x="400" y="95" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="700" fill="#F3EFE5" letter-spacing="2">FitFamily</text>
  <text x="400" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="#A9DCC5">Investigación de mercado · Análisis · Revisión · Exportación</text>
  <!-- Subline -->
  <text x="400" y="160" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#D7A96B">El Cañaveral · Madrid · Prototipo abierto · Actualizado oct 2026</text>
  <!-- Small icons / dots -->
  <circle cx="310" cy="185" r="6" fill="#A9DCC5"/>
  <circle cx="330" cy="185" r="6" fill="#A9DCC5" opacity="0.5"/>
  <circle cx="350" cy="185" r="6" fill="#A9DCC5" opacity="0.25"/>
  <rect x="400" y="178" width="40" height="4" rx="2" fill="#D7A96B"/>
</svg>
